name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  contracts:
    name: Validate schemas and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validators
        run: pip install jsonschema pyyaml check-jsonschema

      - name: IR schema is valid JSON Schema
        run: check-jsonschema --check-metaschema schemas/ir/v1.0.0/ir.schema.json

      - name: Rule schema is valid JSON Schema
        run: check-jsonschema --check-metaschema schemas/rule/v1.0.0/rule.schema.json

      - name: Worked IR example validates against the IR schema
        run: check-jsonschema --schemafile schemas/ir/v1.0.0/ir.schema.json schemas/ir/v1.0.0/example.cisco-ios.ir.json

      - name: Every rule file validates against the rule schema
        run: check-jsonschema --schemafile schemas/rule/v1.0.0/rule.schema.json rules/cis/*.yaml

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Mypy
        working-directory: backend
        run: mypy crucible

      - name: Import contracts (ADR 0001 - nothing downstream of the IR reaches upstream)
        working-directory: backend
        run: lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately minimal. The suite runs on the standard library plus the
      # three packages the pipeline itself needs, because the deployment target
      # is a machine with nothing else on it - so that is what CI proves.
      - name: Install runtime dependencies only
        run: pip install pyyaml reportlab cryptography

      - name: Run the suite with no test framework installed
        working-directory: backend
        run: python tests/run_tests.py

      - name: Run the same suite under pytest
        working-directory: backend
        run: |
          pip install pytest
          pytest -q

  smoke:
    name: End-to-end audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install pyyaml reportlab cryptography

      - name: Audit the bundled fixtures
        working-directory: backend
        # Exit 1 is the correct outcome: the fixtures are deliberately
        # misconfigured and contain critical findings. Exit 2 would mean the
        # auditor could not run, which is the failure we actually care about.
        run: |
          set +e
          python -m crucible.api.cli audit tests/fixtures/devices             --rules ../rules/cis --out ../reports
          code=$?
          set -e
          test "$code" -eq 1 || { echo "::error::expected exit 1, got $code"; exit 1; }

      - name: Verify the ledger it produced
        working-directory: backend
        run: python -m crucible.api.cli verify ../reports/ledger.jsonl

      - name: Check a PDF was actually written
        run: |
          test -s reports/cisco-ios-core-01.pdf
          head -c 4 reports/cisco-ios-core-01.pdf | grep -q "%PDF"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: No external asset references in build output
        working-directory: frontend
        run: npm run check:offline
