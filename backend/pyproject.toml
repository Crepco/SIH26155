# ---------------------------------------------------------------------------
# Crucible backend
#
# Constraint that governs every dependency below: it must be vendorable into an
# offline installation bundle. If it cannot be vendored, it cannot be a
# dependency. See docs/11-air-gap.md.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.1.0"
description = "AI-driven multi-vendor network security compliance auditor with air-gapped verification sandbox"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["compliance", "network-security", "cis", "stig", "nist", "audit", "air-gapped"]

dependencies = [
  # Exactly what the code imports. Every entry is pure Python or ships wheels,
  # so the whole set vendors into the offline bundle (docs/11-air-gap.md).
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "cryptography>=44.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Tier 2 talks to a local Ollama over loopback with the standard library, so the
# model layer needs no Python dependency at all. Ollama itself is a separate,
# optional install; without it the offline lexical proposer is used.

# Multi-user deployment: bulk audits on a worker pool and a graph store. The
# single-process build needs none of it.
scale = [
  "celery>=5.4",
  "redis>=5.2",
  "neo4j>=5.26",
]

# Optional live device pull. Stretch goal, deployment story, never the demo.
live = [
  "netmiko>=4.4",
  "napalm>=5.0",
]

dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-pyyaml",
]

[project.scripts]
crucible = "crucible.api.cli:main"

[tool.setuptools.packages.find]
include = ["crucible*"]

# ---------------------------------------------------------------------------
# Lint and types
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PTH", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# ReportLab ships no type information. The PDF renderer is the only module that
# touches it, so the exemption is scoped to exactly that surface.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["crucible.report.pdf"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: runs the full pipeline against corpus files",
  "sandbox: requires Docker and containerlab",
  "model: requires a local Ollama instance",
]

[tool.coverage.run]
branch = true
source = ["crucible"]

# ---------------------------------------------------------------------------
# Architecture enforcement - ADR 0001
#
# Nothing downstream of the IR may import anything upstream of it. This is the
# rule that keeps the IR a real pivot rather than an aspiration.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "crucible"

[[tool.importlinter.contracts]]
name = "Downstream of the IR never touches raw parsing"
type = "forbidden"
source_modules = [
  "crucible.policy",
  "crucible.graph",
  "crucible.report",
  "crucible.sandbox",
]
forbidden_modules = [
  "crucible.ingest",
  "crucible.parsers",
  "crucible.fingerprint",
]

[[tool.importlinter.contracts]]
name = "The deterministic pipeline never imports the model layer"
type = "forbidden"
source_modules = [
  "crucible.parsers",
  "crucible.policy",
  "crucible.ir",
  "crucible.cascade",
  "crucible.adapters",
  "crucible.pipeline",
]
forbidden_modules = ["crucible.training"]
