#config-version=FGT60F-7.4.4-FW-build2573-240201:opmode=0:vdom=0
#conf_file_ver=1234567890123456789
#buildno=2573
#global_vdom=1
config system global
    set admintimeout 30
    set admin-telnet enable
    set admin-ssh-v1 disable
    set admin-sport 443
    set admin-https-redirect enable
    set hostname "fw-edge-01"
    set timezone 32
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set alias "wan-uplink"
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.0.2 255.255.255.0
        set allowaccess ping https ssh snmp
        set type physical
        set alias "mgmt"
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "users"
        set status down
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2abcdefghijklmnopqrstuvwxyz0123456789
    next
end
config system snmp sysinfo
    set status enable
    set description "edge firewall"
end
config system snmp community
    edit 1
        set name "public"
        set query-v1-status enable
    next
end
config log syslogd setting
    set status enable
    set server "10.0.0.5"
    set facility local7
end
config system ntp
    set ntpsync enable
    set type custom
    set syncinterval 60
    config ntpserver
        edit 1
            set server "10.0.0.1"
        next
    end
end
config firewall policy
    edit 1
        set name "users-to-internet"
        set srcintf "port3"
        set dstintf "port1"
        set action accept
        set schedule "always"
    next
    edit 2
        set name "any-to-mgmt"
        set srcintf "any"
        set dstintf "port2"
        set action accept
        set schedule "always"
    next
end
